project:
  name: Medical Text Classifier API
  version: "0.1.0"

data:
  raw_path: data/raw
  train_file: medical_tc_train.csv
  test_file: medical_tc_test.csv
  labels_file: medical_tc_labels.csv
  processed_path: data/processed
  source_text_column: medical_abstract
  source_label_column: condition_label
  labels_id_column: condition_label
  labels_name_column: condition_name
  text_column: text
  label_column: label
  labels:
    - neoplasms
    - digestive system diseases
    - nervous system diseases
    - cardiovascular diseases
    - general pathological conditions
  train_output_file: train.csv
  validation_output_file: validation.csv
  test_output_file: test.csv

split:
  validation_size: 0.1
  random_state: 42

preprocessing:
  steps:
    - unicode_normalization
    - punctuation_removal
    - lemmatization
    - stopword_removal
  language: english
  spacy_model: en_core_web_sm
  preserve_numbers: true

features:
  type: tfidf  # tfidf | embeddings
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2
  embeddings:
    # scispaCy — vetores treinados em texto biomedico, capturam similaridade
    # semantica (ex.: "carcinoma" ~ "tumor") que o TF-IDF nao ve.
    spacy_model: en_core_sci_md

model:
  type: complement_nb
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  random_forest:
    n_estimators: 160
    max_depth: null
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  gradient_boosting:
    n_estimators: 80
    learning_rate: 0.08
    max_depth: 3
    selection_k: 800
    random_state: 42
  linear_svm:
    C: 1.0
    max_iter: 5000
    class_weight: balanced
    random_state: 42
    calibration_cv: 3
  complement_nb:
    alpha: 1.0
    norm: false

artifacts:
  schema_version: 2
  model_path: models/artifacts
  pipeline_file: triage_pipeline.joblib
  metadata_file: model_metadata.json
  onnx_path: models/onnx
  onnx_file: triage_classifier.onnx
  feature_pipeline_file: vectorizer.joblib
  classes_file: classes.json
  metrics_path: metrics
  metrics_file: eval_metrics.json

registry:
  model_name: medical_text_classifier
  # Metrica de VALIDACAO (nao teste) usada para escolher o run a promover.
  # macro_f1 e macro_precision empatam entre os top runs (< 0.1pp); precision
  # foi o criterio de desempate escolhido.
  metric: validation_macro_precision
  ascending: false
  stage: Production
