name: CI

on:
  push:
  pull_request:
    branches: ["main"]

env:
  POETRY_VERSION: "1.8.3"
  SPACY_MODEL_URL: "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"
  SCISPACY_MODEL_URL: "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_md-0.5.4.tar.gz"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry e dependências
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry install --with dev
          poetry run python -m nltk.downloader stopwords
          poetry run python -m pip install --no-cache-dir "${SPACY_MODEL_URL}" "${SCISPACY_MODEL_URL}"

      - name: ruff check
        run: poetry run ruff check src/ tests/ scripts/

      - name: ruff format --check
        run: poetry run ruff format --check src/ tests/ scripts/

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry e dependências
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry install --with dev
          poetry run python -m nltk.downloader stopwords
          poetry run python -m pip install --no-cache-dir "${SPACY_MODEL_URL}" "${SCISPACY_MODEL_URL}"

      - name: pytest
        run: poetry run pytest tests/ -v --cov=src --cov-report=term-missing

  build:
    name: Build da imagem Docker (api)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem da API
        run: docker build --target api -t ml3-f3-tech-challenge-api:ci .
