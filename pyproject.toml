[tool.poetry]
name = "ml3-f3-tech-challenge"
version = "0.1.0"
description = "Triagem automática de laudos médicos via NLP — FIAP MLE Fase 3 (deploy, CI/CD, monitoramento e latência)"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
scikit-learn = ">=1.4.0,<1.8"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
pydantic-settings = ">=2.2.0"
pyyaml = ">=6.0.1"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
prometheus-client = ">=0.20.0"
joblib = ">=1.4.0"
skl2onnx = ">=1.16.0"
onnxruntime = ">=1.17.0"
nltk = ">=3.10,<4"
spacy = ">=3.8,<3.9"
Unidecode = ">=1.4,<2"
mlflow = "2.16.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0"
mypy = ">=1.10.0"
pre-commit = ">=3.7.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "D", "C90"]
ignore = [
    "ANN401",  # Any em interfaces abstratas é intencional
    "D100",    # docstring em módulo público
    "D104",    # docstring em pacote público
    "D107",    # docstring em __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D"]
"airflow/dags/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore:Importing 'parser.split_arg_string'.*:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
